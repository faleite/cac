<div class="p-md border-b border-outline-variant bg-surface-bright flex items-center gap-sm">

<h3 class="font-button-text text-button-text text-on-surface">Início de Turno</h3>
</div>
<div class="p-md grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant">Data (Automático)</label>
<input class="h-touch-target-min bg-surface-container-low border-none rounded-lg px-md font-body-md text-on-surface-variant cursor-not-allowed" disabled="" type="text" value="24 de Outubro de 2023">
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant">Km Iniciais</label>
<input class="h-touch-target-min bg-surface-container-lowest border border-outline rounded-lg px-md font-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="Ex: 125430" type="number">
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant">Qtd. Objectos (Distribuição)</label>
<input class="h-touch-target-min bg-surface-container-lowest border border-outline rounded-lg px-md font-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="0" type="number">
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant">Qtd. Recolhas (Agendadas)</label>
<input class="h-touch-target-min bg-surface-container-lowest border border-outline rounded-lg px-md font-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-transparent" placeholder="0" type="number">
</div>
</div>

<!-- Fim de Turno Card -->
