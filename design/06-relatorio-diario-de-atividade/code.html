<div class="flex items-center gap-xs text-secondary mb-xs">

</div>
<div>

</div>
</div>
<!-- Metric Card: Not Delivered -->
<div class="bg-surface-container-lowest rounded-lg p-md shadow-sm border-l-[4px] border-primary flex flex-col justify-between min-h-[120px]">
