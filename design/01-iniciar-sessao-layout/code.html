<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        /* Custom styles to handle autofill backgrounds matching surface */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #ffffff inset !important;
            -webkit-text-fill-color: #1a1c1c !important;
        }

<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface shadow-sm z-50">
<div class="flex items-center justify-start px-margin-mobile h-touch-target-min w-full max-w-[768px] mx-auto gap-3">
<span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight"><h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight cursor-text" spellcheck="false" data-stitch-added-classes="cursor-text" style="--tw-border-spacing-y: 0; --tw-translate-x: 0; --tw-translate-y: 0; --tw-rotate: 0; --tw-skew-x: 0; --tw-skew-y: 0; --tw-scale-x: 1; --tw-scale-y: 1; --tw-pan-x: ; --tw-pan-y: ; --tw-pinch-zoom: ; --tw-scroll-snap-strictness: proximity; --tw-gradient-from-position: ; --tw-gradient-via-position: ; --tw-gradient-to-position: ; --tw-ordinal: ; --tw-slashed-zero: ; --tw-numeric-figure: ; --tw-numeric-spacing: ; --tw-numeric-fraction: ; --tw-ring-inset: ; --tw-ring-offset-width: 0px; --tw-ring-offset-color: #fff; --tw-ring-color: rgb(59 130 246 / 0.5); --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000; --tw-shadow: 0 0 #0000; --tw-shadow-colored: 0 0 #0000; --tw-blur: ; --tw-brightness: ; --tw-contrast: ; --tw-grayscale: ; --tw-hue-rotate: ; --tw-invert: ; --tw-saturate: ; --tw-sepia: ; --tw-drop-shadow: ; --tw-backdrop-blur: ; --tw-backdrop-brightness: ; --tw-backdrop-contrast: ; --tw-backdrop-grayscale: ; --tw-backdrop-hue-rotate: ; --tw-backdrop-invert: ; --tw-backdrop-opacity: ; --tw-backdrop-saturate: ; --tw-backdrop-sepia: ; --tw-contain-size: ; --tw-contain-layout: ; --tw-contain-paint: ; --tw-contain-style: ; --tw-text-opacity: 1; color: rgb(168, 0, 28); outline: none !important; box-shadow: none !important;">CAC Atividades</h1></h1>
</div>
</header>
<!-- Main Content Canvas (Transactional Flow - No BottomNav) -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile py-xl w-full max-w-[768px] mx-auto">
<div class="w-full max-w-sm flex flex-col items-center animate-fade-in-up" style="opacity: 1; transform: translateY(0px); transition: opacity 0.5s ease-out, transform 0.5s ease-out;">
<!-- Header Group -->
<div class="text-center mb-xl w-full">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mx-auto mb-md shadow-sm">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<h2 class="font-display-lg text-display-lg text-on-surface mb-xs">Iniciar Sessão</h2>
<p class="font-body-md text-body-md text-secondary">Aceda à sua área de assistente operacional.</p>
</div>
<!-- Login Form -->
<form class="w-full space-y-md" onsubmit="event.preventDefault();">
<!-- Input: Número de Colaborador -->
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary">badge</span>
</div>
<!-- Persistent top-aligned label visually integrated via padding -->
<label class="absolute top-1.5 left-10 font-label-bold text-label-bold text-secondary" for="sc-number">Número de Colaborador (SC)</label>
<input class="block w-full h-[56px] pl-10 pr-3 pt-6 pb-2 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm" id="sc-number" placeholder="Ex: SC123456" required="" type="text">
</div>
<!-- Input: Palavra-passe -->
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-secondary">key</span>
</div>
<label class="absolute top-1.5 left-10 font-label-bold text-label-bold text-secondary" for="password">Palavra-passe</label>
<input class="block w-full h-[56px] pl-10 pr-12 pt-6 pb-2 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm" id="password" placeholder="••••••••" required="" type="password">
<button aria-label="Alternar visibilidade da palavra-passe" class="absolute inset-y-0 right-0 pr-3 flex items-center h-full text-secondary hover:text-on-surface focus:outline-none" id="toggle-password" type="button">
<span class="material-symbols-outlined" id="visibility-icon">visibility_off</span>
</button>
</div>
<!-- Forgot Password (contextual helper) -->
<div class="flex justify-end w-full pt-base">
<a class="font-body-sm text-body-sm text-primary font-semibold hover:underline" href="#">Recuperar palavra-passe?</a>
</div>
<!-- Primary Action -->
<div class="pt-sm">
<button class="w-full h-touch-target-min bg-primary text-on-primary font-button-text text-button-text rounded-lg flex items-center justify-center gap-2 hover:bg-surface-tint active:scale-[0.98] transition-all shadow-[0_4px_12px_rgba(168,0,28,0.2)]" type="submit">
                        Entrar
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Secondary Action / Link -->
<div class="mt-xl text-center w-full border-t border-surface-variant pt-lg">
<p class="font-body-md text-body-md text-secondary">
                    Ainda não tem conta? <br>
<a class="font-button-text text-button-text text-primary hover:underline mt-base inline-block" href="#">Criar Conta</a>
</p>
</div>
</div>
</main>
<script>
        // Micro-interaction for password visibility toggle
        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const visibilityIcon = document.getElementById('visibility-icon');

        togglePassword.addEventListener('click', function (e) {
            // Toggle the type attribute
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            // Toggle the icon
            visibilityIcon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
        });

        // Simple form animation on load
        document.addEventListener('DOMContentLoaded', () => {
            const formContainer = document.querySelector('.animate-fade-in-up');
            if(formContainer) {
                formContainer.style.opacity = '0';
                formContainer.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    formContainer.style.transition = 'opacity 0.5s ease-out, transform 0.5s ease-out';
                    formContainer.style.opacity = '1';
                    formContainer.style.transform = 'translateY(0)';
                }, 100);
            }
        });
    </script>


</body></html>
