name: Deploy Servidor Oracle (CAC)

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Atualizar aplicação no servidor Oracle
    runs-on: ubuntu-latest

    steps:
      - name: Configurar acesso SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H ${{ secrets.ORACLE_HOST }} >> ~/.ssh/known_hosts

      - name: Executar atualização remota no servidor
        run: |
          ssh -i ~/.ssh/oracle_key ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} "
            cd ${{ secrets.ORACLE_PATH }} && \
            git pull origin main && \
            docker compose up -d --build && \
            docker compose exec -T backend npm run prisma:migrate
          "
