<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CAC Atividades - Iniciar Sessão</title>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="app-header-inner">
      <a href="/login.html" class="brand-title">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        CAC Atividades
      </a>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="app-container" style="justify-content: center; max-width: 420px;">
    <div class="card" style="margin-top: 20px;">
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="width: 56px; height: 56px; background-color: var(--color-on-primary-container); color: var(--color-primary); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px;">
          <svg style="width: 28px; height: 28px; fill: currentColor;" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        </div>
        <h2 style="font-size: 22px; font-weight: 700; color: var(--color-on-surface);">Iniciar Sessão</h2>
        <p style="font-size: 14px; color: var(--color-secondary);">Aceda à sua área de assistente operacional.</p>
      </div>

      <!-- Alertas -->
      <div id="alerta-container" style="display: none;"></div>

      <!-- Formulário de Login -->
      <form id="form-login">
        <div class="form-group">
          <label class="form-label" for="identificador">Número SC ou E-mail</label>
          <input class="form-control" type="text" id="identificador" name="identificador" placeholder="Ex: SC2825 ou email@exemplo.pt" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="senha">Palavra-passe</label>
          <div style="position: relative;">
            <input class="form-control" type="password" id="senha" name="senha" placeholder="••••••••" required autocomplete="current-password" style="padding-right: 70px;">
            <button type="button" id="btn-toggle-senha" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 13px; font-weight: 600; color: var(--color-secondary); cursor: pointer; padding: 8px;">Mostrar</button>
          </div>
        </div>

        <div style="text-align: right; margin-bottom: 20px;">
          <a href="/recuperar-senha.html" class="link" style="font-size: 13px;">Esqueceu-se da palavra-passe?</a>
        </div>

        <button type="submit" class="btn btn-primary" id="btn-submit">
          <span>Entrar</span>
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
        </button>
      </form>
    </div>

    <!-- Rodapé com Link para Registo -->
    <div style="text-align: center; padding: 16px;">
      <p style="font-size: 14px; color: var(--color-secondary);">
        Ainda não tem conta?<br>
        <a href="/registo.html" class="link" style="font-size: 15px; display: inline-block; margin-top: 6px;">Criar Conta de Colaborador</a>
      </p>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    CAC.configurarToggleSenha('senha', 'btn-toggle-senha');

    // Verificar se já está autenticado
    document.addEventListener('DOMContentLoaded', async () => {
      const usuario = await CAC.obterSessao();
      if (usuario) {
        window.location.href = '/perfil.html';
      }
    });

    const form = document.getElementById('form-login');
    const btnSubmit = document.getElementById('btn-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      CAC.limparAlerta('alerta-container');

      const identificador = document.getElementById('identificador').value.trim();
      const senha = document.getElementById('senha').value;

      btnSubmit.disabled = true;
      btnSubmit.style.opacity = '0.7';

      const res = await CAC.api('/auth/login', {
        method: 'POST',
        body: { identificador, senha }
      });

      btnSubmit.disabled = false;
      btnSubmit.style.opacity = '1';

      if (res.ok) {
        CAC.mostrarAlerta('alerta-container', 'Sessão iniciada com sucesso. A redirecionar...', 'success');
        setTimeout(() => {
          window.location.href = '/perfil.html';
        }, 600);
      } else {
        CAC.mostrarAlerta('alerta-container', res.data.mensagem || 'Credenciais de acesso incorretas. Tente novamente.', 'danger');
      }
    });
  </script>
</body>
</html>
