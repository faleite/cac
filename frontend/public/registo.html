<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CAC Atividades - Auto-Registo</title>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="app-header-inner">
      <a href="/login.html" class="brand-title">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        CAC Atividades
      </a>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="app-container" style="max-width: 460px; padding-top: 24px; padding-bottom: 40px;">
    <div class="card">
      <div style="margin-bottom: 20px;">
        <h2 style="font-size: 22px; font-weight: 700; color: var(--color-on-surface); margin-bottom: 4px;">Registo de Utilizador</h2>
        <p style="font-size: 14px; color: var(--color-secondary);">Crie a sua conta de colaborador para aceder ao sistema.</p>
      </div>

      <!-- Alertas -->
      <div id="alerta-container" style="display: none;"></div>

      <!-- Formulário de Auto-Registo -->
      <form id="form-registo">
        <div class="form-group">
          <label class="form-label" for="nome_completo">Nome Completo</label>
          <input class="form-control" type="text" id="nome_completo" name="nome_completo" placeholder="Insira o seu nome completo" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="numero_sc">Número de Colaborador (SC)</label>
          <input class="form-control" type="text" id="numero_sc" name="numero_sc" placeholder="Ex: SC2825" required style="text-transform: uppercase;">
        </div>

        <div class="form-group">
          <label class="form-label" for="telemovel">Número de Telemóvel</label>
          <input class="form-control" type="tel" id="telemovel" name="telemovel" placeholder="Ex: 912345678" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Endereço de E-mail</label>
          <input class="form-control" type="email" id="email" name="email" placeholder="colaborador@correios.pt" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="senha">Palavra-passe</label>
          <div style="position: relative;">
            <input class="form-control" type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required minlength="6" style="padding-right: 70px;">
            <button type="button" id="btn-toggle-senha" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 13px; font-weight: 600; color: var(--color-secondary); cursor: pointer; padding: 8px;">Mostrar</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmar_senha">Confirmar Palavra-passe</label>
          <input class="form-control" type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Repita a palavra-passe" required minlength="6">
        </div>

        <!-- Consentimento RGPD (Consentimento Livre e Informado) -->
        <div class="form-group" style="margin-top: 16px; margin-bottom: 20px;">
          <label style="display: flex; align-items: flex-start; gap: 10px; cursor: pointer; font-size: 13px; color: var(--color-on-surface); line-height: 1.45;">
            <input type="checkbox" id="aceite_termos" name="aceite_termos" style="width: 18px; height: 18px; margin-top: 2px; accent-color: var(--color-primary); cursor: pointer;" required>
            <span>Li e aceito os <a href="/termos-privacidade.html#termos" target="_blank" class="link" style="text-decoration: underline; font-weight: 600;">Termos de Uso</a> e a <a href="/termos-privacidade.html#privacidade" target="_blank" class="link" style="text-decoration: underline; font-weight: 600;">Política de Privacidade</a>.</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary" id="btn-submit" disabled style="margin-top: 8px; opacity: 0.55; cursor: not-allowed;">
          <span>Criar Conta e Entrar</span>
          <svg class="icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </button>
      </form>
    </div>

    <!-- Rodapé -->
    <div style="text-align: center; padding: 12px;">
      <p style="font-size: 14px; color: var(--color-secondary);">
        Já tem uma conta? <a href="/login.html" class="link">Iniciar Sessão</a>
      </p>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    CAC.configurarToggleSenha('senha', 'btn-toggle-senha');

    const form = document.getElementById('form-registo');
    const btnSubmit = document.getElementById('btn-submit');
    const chkAceite = document.getElementById('aceite_termos');

    // Controle reativo do botão de submissão pelo aceite dos termos
    function atualizarEstadoBotao() {
      if (chkAceite.checked) {
        btnSubmit.disabled = false;
        btnSubmit.style.opacity = '1';
        btnSubmit.style.cursor = 'pointer';
      } else {
        btnSubmit.disabled = true;
        btnSubmit.style.opacity = '0.55';
        btnSubmit.style.cursor = 'not-allowed';
      }
    }

    chkAceite.addEventListener('change', atualizarEstadoBotao);
    // Garantir estado desmarcado ao carregar/recarregar a página
    chkAceite.checked = false;
    atualizarEstadoBotao();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      CAC.limparAlerta('alerta-container');

      if (!chkAceite.checked) {
        CAC.mostrarAlerta('alerta-container', 'Por favor, assinale o consentimento com os Termos de Uso e Política de Privacidade.', 'danger');
        return;
      }

      const nome_completo = document.getElementById('nome_completo').value.trim();
      const numero_sc = document.getElementById('numero_sc').value.trim().toUpperCase();
      const telemovel = document.getElementById('telemovel').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const senha = document.getElementById('senha').value;
      const confirmar_senha = document.getElementById('confirmar_senha').value;

      if (senha !== confirmar_senha) {
        CAC.mostrarAlerta('alerta-container', 'As palavras-passe introduzidas não coincidem.', 'danger');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.style.opacity = '0.7';

      const res = await CAC.api('/auth/registo', {
        method: 'POST',
        body: {
          nome_completo,
          numero_sc,
          telemovel,
          email,
          senha,
          confirmar_senha,
          aceitou_termos: true
        }
      });

      btnSubmit.disabled = false;
      atualizarEstadoBotao();

      if (res.ok) {
        CAC.mostrarAlerta('alerta-container', 'Conta criada com sucesso! A configurar o seu perfil...', 'success');
        setTimeout(() => {
          window.location.href = '/perfil.html';
        }, 800);
      } else {
        CAC.mostrarAlerta('alerta-container', res.data.mensagem || 'Ocorreu um erro ao criar a conta.', 'danger');
      }
    });
  </script>
</body>
</html>
