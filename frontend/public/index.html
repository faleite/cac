<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAC Atividades - Controlo Atividades Correios</title>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh;">
  <div style="text-align: center; padding: 24px;">
    <h1 style="color: var(--color-primary); font-size: 28px; margin-bottom: 8px;">CAC Atividades</h1>
    <p style="color: var(--color-secondary); font-size: 15px;">A verificar sessão...</p>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const usuario = await CAC.obterSessao();
      if (usuario) {
        window.location.href = '/abertura.html';
      } else {
        window.location.href = '/login.html';
      }
    });
  </script>
</body>
</html>
