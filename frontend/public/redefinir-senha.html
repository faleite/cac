<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CAC Atividades - Redefinir Palavra-passe</title>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="app-header-inner">
      <a href="/login.html" class="brand-title">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        CAC Atividades
      </a>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="app-container" style="justify-content: center; max-width: 420px;">
    <div class="card" style="margin-top: 20px;">
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="width: 56px; height: 56px; background-color: var(--color-on-primary-container); color: var(--color-primary); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px;">
          <svg style="width: 28px; height: 28px; fill: currentColor;" viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
        </div>
        <h2 style="font-size: 22px; font-weight: 700; color: var(--color-on-surface);">Nova Palavra-passe</h2>
        <p style="font-size: 14px; color: var(--color-secondary);">Defina a sua nova credencial de acesso.</p>
      </div>

      <!-- Alertas -->
      <div id="alerta-container" style="display: none;"></div>

      <!-- Formulário de Redefinição -->
      <form id="form-redefinir">
        <div class="form-group">
          <label class="form-label" for="nova_senha">Nova Palavra-passe</label>
          <div style="position: relative;">
            <input class="form-control" type="password" id="nova_senha" name="nova_senha" placeholder="Mínimo 6 caracteres" required minlength="6" style="padding-right: 70px;" autofocus>
            <button type="button" id="btn-toggle-senha" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 13px; font-weight: 600; color: var(--color-secondary); cursor: pointer; padding: 8px;">Mostrar</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmar_senha">Confirmar Nova Palavra-passe</label>
          <input class="form-control" type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Repita a nova palavra-passe" required minlength="6">
        </div>

        <button type="submit" class="btn btn-primary" id="btn-submit" style="margin-top: 8px;">
          <span>Guardar Nova Palavra-passe</span>
          <svg class="icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </button>
      </form>
    </div>

    <!-- Rodapé -->
    <div style="text-align: center; padding: 12px;">
      <a href="/login.html" class="link" style="font-size: 14px;">&larr; Voltar ao Início de Sessão</a>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    CAC.configurarToggleSenha('nova_senha', 'btn-toggle-senha');

    // Obter token da URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      CAC.mostrarAlerta('alerta-container', 'Token de recuperação ausente. Por favor utilize o link enviado para o seu e-mail.', 'danger');
      document.getElementById('form-redefinir').style.display = 'none';
    }

    const form = document.getElementById('form-redefinir');
    const btnSubmit = document.getElementById('btn-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      CAC.limparAlerta('alerta-container');

      const nova_senha = document.getElementById('nova_senha').value;
      const confirmar_senha = document.getElementById('confirmar_senha').value;

      if (nova_senha !== confirmar_senha) {
        CAC.mostrarAlerta('alerta-container', 'As palavras-passe introduzidas não coincidem.', 'danger');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.style.opacity = '0.7';

      const res = await CAC.api('/auth/redefinir-senha', {
        method: 'POST',
        body: { token, nova_senha, confirmar_senha }
      });

      btnSubmit.disabled = false;
      btnSubmit.style.opacity = '1';

      if (res.ok) {
        CAC.mostrarAlerta('alerta-container', res.data.mensagem + ' A redirecionar para o início de sessão...', 'success');
        setTimeout(() => {
          window.location.href = '/login.html';
        }, 1500);
      } else {
        CAC.mostrarAlerta('alerta-container', res.data.mensagem || 'Ocorreu um erro ao redefinir a palavra-passe.', 'danger');
      }
    });
  </script>
</body>
</html>
