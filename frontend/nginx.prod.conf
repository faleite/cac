# ==============================================================================
# CAC Atividades - Configuração de Produção Nginx com HTTPS (Let's Encrypt)
# ==============================================================================

# 1. Redirecionamento HTTP (porta 80) para HTTPS (porta 443)
server {
    listen 80;
    server_name _;

    # Desafio de renovação e validação ACME do Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redireciona todas as demais requisições HTTP para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor Principal Seguro HTTPS (porta 443)
server {
    listen 443 ssl;
    server_name _;

    # Certificados SSL gerenciados pelo Certbot / Let's Encrypt
    # NOTA: O caminho abaixo aponta para o volume montado no container
    # Substitua "SEU_DOMINIO" pelo domínio configurado no Certbot
    ssl_certificate /etc/letsencrypt/live/SEU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO/privkey.pem;

    # Protocolos e Cifras Criptográficas Modernas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cabeçalhos de Segurança HTTP (HSTS, Anti-sniffing, Anti-clickjacking)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Desafio de validação ACME no HTTPS (se necessário)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 1. Servir arquivos estáticos do Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Otimização e cache estático
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # 2. Proxy Reverso para o Backend Node.js
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        # Repassa cabeçalhos com informações reais da conexão do cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
